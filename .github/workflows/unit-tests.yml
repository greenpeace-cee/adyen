name: "Run unit tests"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    uses: greenpeace-cee/civi-ci/.github/workflows/tests.yml@main
    with:
      dependencies: |
        https://github.com/greenpeace-cee/mjwshared.git
      install-script: |
        composer install --working-dir="$EXT_DIR/$EXTENSION" --no-dev
        cv en "$EXTENSION"
